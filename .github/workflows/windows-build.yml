name: Windows builds

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 3.5 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory packages -NonInteractive
          $root = (Resolve-Path 'packages/Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3/build').Path
          "FRAMEWORK_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build managed projects
        shell: pwsh
        run: |
          $projects = @(
            'libwbfsNET/libwbfsNET.csproj',
            'ChannelCreationWrapper/ChannelCreationWrapper.csproj',
            'RssUpdater/RssUpdater.csproj',
            'UnRarNET/UnRarNET.csproj',
            'WBFS Manager/WBFSManager.csproj'
          )
          foreach ($project in $projects) {
            & msbuild $project /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU "/p:TargetFrameworkRootPath=$env:FRAMEWORK_ROOT\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify native dependencies
        shell: pwsh
        run: |
          # The original repository contains only x86/x64 native binaries.
          # ARM64 must not be published as native until all dependencies are ported.
          if ('${{ matrix.arch }}' -eq 'arm64') {
            throw 'Native ARM64 build not yet supported: legacy C++ projects and bundled third-party DLLs require porting.'
          }
          throw 'Native C++ projects still use VS2008 .vcproj format; conversion and native builds are required before packaging.'

      - name: Upload application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WBFSManager-${{ matrix.arch }}
          path: WBFS Manager/bin/Release/
          if-no-files-found: error
