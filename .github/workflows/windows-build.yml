name: Windows builds

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      # Modern MSBuild's WPF markup compiler cannot load the .NET 3.5
      # WindowsBase reference assemblies. Compile the legacy source against
      # the in-box .NET Framework 4.8 WPF assemblies instead.
      - name: Build managed projects
        shell: pwsh
        run: |
          $projects = @(
            'libwbfsNET/libwbfsNET.csproj',
            'ChannelCreationWrapper/ChannelCreationWrapper.csproj',
            'RssUpdater/RssUpdater.csproj',
            'UnRarNET/UnRarNET.csproj',
            'WBFS Manager/WBFSManager.csproj'
          )
          foreach ($project in $projects) {
            & msbuild $project /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:TargetFrameworkVersion=v4.8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish managed build diagnostic
        shell: pwsh
        run: |
          Write-Host 'Managed .NET build completed.'
          Write-Host 'Native DLL builds and deployable architecture-specific packages are not yet implemented.'

      - name: Upload managed build output (not a release package)
        uses: actions/upload-artifact@v5
        with:
          name: WBFSManager-managed-${{ matrix.arch }}
          path: |
            WBFS Manager/bin/Release/
          if-no-files-found: error
