name: Windows builds

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      # Modern MSBuild's WPF markup compiler cannot load the .NET 3.5
      # WindowsBase reference assemblies. Compile the legacy source against
      # the in-box .NET Framework 4.8 WPF assemblies instead.
      - name: Build managed projects
        shell: pwsh
        run: |
          $projects = @(
            'libwbfsNET/libwbfsNET.csproj',
            'ChannelCreationWrapper/ChannelCreationWrapper.csproj',
            'RssUpdater/RssUpdater.csproj',
            'WBFS Manager/WBFSManager.csproj'
          )
          foreach ($project in $projects) {
            & msbuild $project /restore /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:TargetFrameworkVersion=v4.8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish managed build diagnostic
        shell: pwsh
        run: |
          Write-Host 'Managed .NET build completed.'
          Write-Host 'This is an unverified managed diagnostic artifact, NOT an ARM64 native build or release.'

      - name: Upload managed build output (not a release package)
        uses: actions/upload-artifact@v5
        with:
          name: WBFSManager-managed-AnyCPU-unverified
          path: |
            WBFS Manager/bin/Release/**
            !WBFS Manager/bin/Release/**/*.pdb
            !WBFS Manager/bin/Release/**/*.cs
            !WBFS Manager/bin/Release/**/*.resx
          if-no-files-found: error

  native-wrapper:
    # ARM64 is exploratory: .NET Framework 4.8 packaging still needs an ARM64-compatible host.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    # Compile the native WBFS bridge from checked-in source rather than
    # silently trusting the prebuilt DLL in the managed project.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
        include:
          - arch: x86
            vcvars: x86
          - arch: x64
            vcvars: x64
          - arch: arm64
            vcvars: amd64_arm64
    steps:
      - uses: actions/checkout@v5
      - name: Build WBFS native bridge with MSVC
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\\VC\\Auxiliary\\Build\\vcvarsall.bat" ${{ matrix.vcvars }}
          if errorlevel 1 exit /b 1
          mkdir native-out
          cd native-out
          cl /nologo /c /O2 /MD /DWIN32 /D_CRT_SECURE_NO_WARNINGS /I"..\\libwbfs\\include" /I"..\\libwbfsNETwrapper" "..\\libwbfs\\src\\libwbfs.c" "..\\libwbfs\\src\\libwbfs_win32.c" "..\\libwbfs\\src\\rijndael.c" "..\\libwbfs\\src\\wiidisc.c" "..\\libwbfsNETwrapper\\DiskAccessTools.c" "..\\libwbfsNETwrapper\\libwbfsExt.c" "..\\libwbfsNETwrapper\\CSWtools.c"
          if errorlevel 1 exit /b 1
          cl /nologo /LD /O2 /MD /EHsc /DWIN32 /D_CRT_SECURE_NO_WARNINGS /I"..\\libwbfs\\include" /I"..\\libwbfsNETwrapper" "..\\libwbfsNETwrapper\\WbfsInterm.cpp" *.obj /link /OUT:libwbfsNETwrapper.dll ws2_32.lib
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v5
        with:
          name: WBFS-native-source-build-${{ matrix.arch }}-unverified
          path: native-out/libwbfsNETwrapper.dll
          if-no-files-found: error

  package-x86:
    needs: [build, native-wrapper]
    runs-on: windows-2022
    steps:
      - name: Download managed build
        uses: actions/download-artifact@v5
        with:
          name: WBFSManager-managed-AnyCPU-unverified
          path: dist
      - name: Download freshly compiled x86 native WBFS bridge
        uses: actions/download-artifact@v5
        with:
          name: WBFS-native-source-build-x86-unverified
          path: rebuilt-native
      - name: Replace legacy WBFS bridge and validate core files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'rebuilt-native/libwbfsNETwrapper.dll' 'dist/libwbfsNETwrapper.dll' -Force
          foreach ($file in @('WBFSManager.exe', 'libwbfsNET.dll', 'libwbfsNETwrapper.dll', 'Infralution.Localization.Wpf.dll')) {
            if (!(Test-Path "dist/$file")) { throw "Missing required file: $file" }
          }
          Get-FileHash 'dist/libwbfsNETwrapper.dll' -Algorithm SHA256 | Format-List
          Write-Host 'WARNING: ChannelCreation.dll, bannerExtractionWrapper.dll and unrar.dll are not supplied by this package.'
      - name: Verify x86 package integrity and record hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b = [IO.File]::ReadAllBytes('dist/libwbfsNETwrapper.dll')
          $off = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $off + 4) -ne 0x14c) { throw 'Native x86 wrapper has wrong machine type' }
          foreach ($name in @('unrar.dll', 'libeay32.dll', 'ssleay32.dll')) {
            if (Get-ChildItem 'dist' -Recurse -File -Filter $name) { throw "Obsolete library unexpectedly packaged: $name" }
          }
          Get-ChildItem 'dist' -File -Recurse | Where-Object { $_.Extension -notin @('.pdb','.cs','.resx') } | Sort-Object FullName | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $($_.FullName.Substring((Resolve-Path dist).Path.Length + 1))"
          } | Set-Content 'dist/SHA256SUMS.txt'
      - name: Upload x86 diagnostic package with rebuilt native bridge
        uses: actions/upload-artifact@v5
        with:
          name: WBFSManager-x86-rebuilt-wrapper-NOT-TESTED
          path: dist/
          if-no-files-found: error

  build-managed-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - name: Build .NET Framework x64 application
        shell: pwsh
        run: |
          $projects = @(
            'libwbfsNET/libwbfsNET.csproj',
            'ChannelCreationWrapper/ChannelCreationWrapper.csproj',
            'RssUpdater/RssUpdater.csproj',
            'WBFS Manager/WBFSManager.csproj'
          )
          foreach ($project in $projects) {
            & msbuild $project /restore /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:PlatformTarget=x64 /p:TargetFrameworkVersion=v4.8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v5
        with:
          name: WBFS-managed-x64-internal
          path: |
            WBFS Manager/bin/Release/**
            !WBFS Manager/bin/Release/**/*.pdb
            !WBFS Manager/bin/Release/**/*.cs
            !WBFS Manager/bin/Release/**/*.resx
          if-no-files-found: error

  package-x64:
    needs: [build-managed-x64, native-wrapper]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: WBFS-managed-x64-internal
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: WBFS-native-source-build-x64-unverified
          path: rebuilt-native
      - name: Install x64 native wrapper and verify architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'rebuilt-native/libwbfsNETwrapper.dll' 'dist/libwbfsNETwrapper.dll' -Force
          foreach ($file in @('WBFSManager.exe','libwbfsNET.dll','libwbfsNETwrapper.dll','Infralution.Localization.Wpf.dll')) {
            if (!(Test-Path "dist/$file")) { throw "Missing required file: $file" }
          }
          $bytes = [IO.File]::ReadAllBytes('dist/libwbfsNETwrapper.dll')
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected x64 native wrapper, got PE machine 0x$($machine.ToString('X4'))" }
          Write-Host 'NOTE: RAR and channel extraction native libraries are not yet packaged. These features require additional work.'
      - name: Verify x64 package dependencies and record hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('unrar.dll', 'libeay32.dll', 'ssleay32.dll')) {
            if (Get-ChildItem 'dist' -Recurse -File -Filter $name) { throw "Obsolete library unexpectedly packaged: $name" }
          }
          Get-ChildItem 'dist' -File -Recurse | Where-Object { $_.Extension -notin @('.pdb','.cs','.resx') } | Sort-Object FullName | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $($_.FullName.Substring((Resolve-Path dist).Path.Length + 1))"
          } | Set-Content 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v5
        with:
          name: WBFSManager-x64-rebuilt-wrapper-NOT-TESTED
          path: dist/
          if-no-files-found: error


  package-arm64-experimental:
    # .NET Framework 4.8.1 has native ARM64 support on Windows 11.
    # Execute the resulting application on a real ARM64 hosted runner before upload.
    needs: [native-wrapper]
    runs-on: windows-11-vs2026-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - name: Build managed app against native ARM64-capable .NET Framework 4.8.1
        shell: pwsh
        run: |
          $projects = @(
            'libwbfsNET/libwbfsNET.csproj',
            'ChannelCreationWrapper/ChannelCreationWrapper.csproj',
            'RssUpdater/RssUpdater.csproj',
            'WBFS Manager/WBFSManager.csproj'
          )
          foreach ($project in $projects) {
            & msbuild $project /restore /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:PlatformTarget=ARM64 /p:TargetFrameworkVersion=v4.8.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/download-artifact@v5
        with:
          name: WBFS-native-source-build-arm64-unverified
          path: rebuilt-native
      - name: Assemble and inspect ARM64 native library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'WBFS Manager/bin/Release'
          Copy-Item 'rebuilt-native/libwbfsNETwrapper.dll' "$dist/libwbfsNETwrapper.dll" -Force
          $bytes = [IO.File]::ReadAllBytes("$dist/libwbfsNETwrapper.dll")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw "Expected ARM64 native wrapper, got PE machine 0x$($machine.ToString('X4'))" }
      - name: Smoke-test managed metadata and native DLL load on ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'WBFS Manager/bin/Release').Path
          $app = [Reflection.Assembly]::LoadFrom((Join-Path $dist 'WBFSManager.exe'))
          $resources = @($app.GetManifestResourceNames())
          if ($resources.Count -eq 0) { throw 'Managed executable has no embedded resources.' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeProbe {
              [DllImport("kernel32.dll", EntryPoint="LoadLibraryW", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr Load(string path);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool FreeLibrary(IntPtr module);
              [DllImport("kernel32.dll", CharSet=CharSet.Ansi, SetLastError=true)]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
          }
          '@
          $dll = [NativeProbe]::Load((Join-Path $dist 'libwbfsNETwrapper.dll'))
          if ($dll -eq [IntPtr]::Zero) { throw "Could not load ARM64 native library; Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          try {
            if ([NativeProbe]::GetProcAddress($dll, 'OpenDrive') -eq [IntPtr]::Zero) {
              throw 'Required OpenDrive export missing from native wrapper'
            }
          } finally { [void][NativeProbe]::FreeLibrary($dll) }
          Write-Host 'ARM64 managed assembly and native library load checks passed (GUI and disk operations NOT tested).'
      - name: Verify ARM64 package dependencies and record hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'WBFS Manager/bin/Release'
          foreach ($name in @('unrar.dll', 'libeay32.dll', 'ssleay32.dll')) {
            if (Get-ChildItem $dist -Recurse -File -Filter $name) { throw "Obsolete library unexpectedly packaged: $name" }
          }
          Get-ChildItem $dist -File -Recurse | Where-Object { $_.Extension -notin @('.pdb','.cs','.resx') } | Sort-Object FullName | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $($_.FullName.Substring((Resolve-Path $dist).Path.Length + 1))"
          } | Set-Content "$dist/SHA256SUMS.txt"
      - name: Upload ARM64 experimental package
        uses: actions/upload-artifact@v5
        with:
          name: WBFSManager-ARM64-EXPERIMENTAL-NOT-TESTED
          path: |
            WBFS Manager/bin/Release/**
            !WBFS Manager/bin/Release/**/*.pdb
            !WBFS Manager/bin/Release/**/*.cs
            !WBFS Manager/bin/Release/**/*.resx
          if-no-files-found: error

  modern-crypto-native-exploratory:
    # This is a separate expensive experiment, not a release gate.
    if: github.event_name == 'workflow_dispatch'
    # These legacy modules were linked against pre-1.0 OpenSSL. Attempt to
    # rebuild against supported OpenSSL 3 instead of bundling the old binaries.
    # Never upload these as working dependencies until compatibility is tested.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install maintained OpenSSL for x64
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Try building channel and banner modules against OpenSSL 3
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\\VC\\Auxiliary\\Build\\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          mkdir crypto-out
          cd crypto-out
          cl /nologo /LD /O2 /MD /EHsc /DWIN32 /D_CRT_SECURE_NO_WARNINGS /I"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\include" /I"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\include\\openssl" /I"..\\bannerExtractionWrapper\\include" "..\\bannerExtractionWrapper\\src\\global.c" "..\\bannerExtractionWrapper\\src\\Stdafx.cpp" "..\\bannerExtractionWrapper\\src\\WIIDisc.cpp" "..\\bannerExtractionWrapper\\src\\wiiscrubberWrapper.cpp" /link /OUT:bannerExtractionWrapper.dll /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\lib" libcrypto.lib libssl.lib
          if errorlevel 1 exit /b 1
          cl /nologo /LD /O2 /MD /EHsc /DWIN32 /D_CRT_SECURE_NO_WARNINGS /I"..\\ChannelCreation" /I"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\include" /I"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\include\\openssl" "..\\ChannelCreation\\bn.c" "..\\ChannelCreation\\ec.c" "..\\ChannelCreation\\tools.c" "..\\ChannelCreation\\wadhandler.cpp" /link /OUT:ChannelCreation.dll /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\lib" libcrypto.lib libssl.lib
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v5
        with:
          name: crypto-modules-OpenSSL3-x64-UNVERIFIED
          path: crypto-out/*.dll
          if-no-files-found: error
